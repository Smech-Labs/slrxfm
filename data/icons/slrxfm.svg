<!--
  Original artwork for SLRXFM, drawn fresh for this project. It is a
  generic "open folder with a link/chain glyph" composition chosen only
  because it reads clearly at small sizes, not because it echoes any
  specific real file manager's icon. It is NOT extracted, traced, or
  derived from the original Xandros Desktop 1.0 XandrosFileManager icon
  or any other shipped Xandros .deb resource -- see docs/CLEAN_ROOM.md,
  which draws the same line for this project's code.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="folderBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#3867d6"/>
    </linearGradient>
    <linearGradient id="folderFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb6ff"/>
      <stop offset="1" stop-color="#6a95f0"/>
    </linearGradient>
  </defs>

  <path d="M4 12c0-1.7 1.3-3 3-3h10l4 4h20c1.7 0 3 1.3 3 3v4H4z" fill="url(#folderBack)"/>

  <rect x="3" y="16" width="42" height="24" rx="3" fill="url(#folderFront)"/>

  <g transform="translate(14,21)" fill="none" stroke="#1f2d50" stroke-width="2.6" stroke-linecap="round">
    <rect x="0" y="6" width="9" height="9" rx="3"/>
    <rect x="11" y="-2" width="9" height="9" rx="3"/>
    <path d="M9 11 L16 6"/>
  </g>
</svg>
